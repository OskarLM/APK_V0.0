<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <title>MIS GASTOS V0.0 BETA</title>

  <meta name="theme-color" content="#d4af37" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon"
        href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b0f1a'/><circle cx='50' cy='50' r='40' fill='none' stroke='%23d4af37' stroke-width='4'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='serif' font-weight='bold' font-size='35' fill='%23d4af37'>O&amp;J</text></svg>'" />
  <link rel="stylesheet" href="./css/style.css" />

  <style>
    /* ── BARRA DE PESTAÑAS ── */
    .tab-bar {
      display: flex;
      background: rgba(0,0,0,.65);
      border-bottom: 1px solid rgba(212,175,55,.2);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .tab-btn {
      flex: 1;
      padding: 9px 2px 7px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: rgba(255,255,255,.4);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
      transition: color .15s, border-color .15s;
    }
    .tab-btn .ti { font-size: 19px; line-height: 1; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* ── SUB-PESTAÑAS GRÁFICOS ── */
    #gtab-bar {
      display: none; /* oculto salvo en pestaña graficos */
      border-bottom: 1px solid rgba(212,175,55,.15);
      background: rgba(0,0,0,.25);
    }
    #gtab-bar.visible { display: flex; }
    .gtab-btn {
      flex: 1; padding: 10px 4px;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      color: rgba(255,255,255,.4);
      font-size: 10px; font-weight: 700;
      letter-spacing: .3px; cursor: pointer;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
      transition: color .15s, border-color .15s;
    }
    .gtab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* ── TOGGLE CASA (solo visible en graficos) ── */
    #casaToggleBar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 7px 16px;
      border-bottom: 1px solid rgba(212,175,55,.1);
      background: rgba(0,0,0,.2);
    }
    #casaToggleBar.visible { display: flex; }

    /* ── FILTROS (solo visible en lista) ── */
    #filtrosBar { display: none; }
    #filtrosBar.visible { display: flex; flex-wrap: wrap; }

    /* ── TARTA: contenedor propio ── */
    #tartaContainer {
      display: none;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 250px;
    }
    #tartaContainer.visible { display: block; }
  </style>
</head>

<body>
  <!-- PIN -->
  <div id="authOverlay" class="popup-overlay" role="dialog" aria-modal="true" aria-label="Acceso PIN">
    <div class="popup-content">
      <h2 style="color:var(--primary);margin-bottom:10px">ACCESO GOLD</h2>
      <div class="pin-dots">
        <div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div>
      </div>
      <div class="pin-grid">
        <button class="btn-pin" onclick="pressPin(1)">1</button>
        <button class="btn-pin" onclick="pressPin(2)">2</button>
        <button class="btn-pin" onclick="pressPin(3)">3</button>
        <button class="btn-pin" onclick="pressPin(4)">4</button>
        <button class="btn-pin" onclick="pressPin(5)">5</button>
        <button class="btn-pin" onclick="pressPin(6)">6</button>
        <button class="btn-pin" onclick="pressPin(7)">7</button>
        <button class="btn-pin" onclick="pressPin(8)">8</button>
        <button class="btn-pin" onclick="pressPin(9)">9</button>
        <button class="btn-pin" onclick="biometricAuth()" style="color:var(--electric-blue)">🫬</button>
        <button class="btn-pin" onclick="pressPin(0)">0</button>
        <button class="btn-pin" onclick="clearPin()" style="color:var(--danger)">✖</button>
      </div>
    </div>
  </div>

  <div class="background-icon">O&amp;J</div>

  <!-- VISTA PRINCIPAL -->
  <div id="movimientos" class="hidden">

    <div class="topbar">MIS GASTOS • V0.0 BETA</div>

    <!-- BARRA DE PESTAÑAS -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tbn-lista" onclick="irTab('lista')">
        <span class="ti">📋</span>Gastos
      </button>
      <button class="tab-btn" id="tbn-graficos" onclick="irTab('graficos')">
        <span class="ti">📈</span>Gráficos
      </button>
    </div>

    <!-- SUB-PESTAÑAS GRÁFICOS (ocultas por defecto) -->
    <div id="gtab-bar">
      <button class="gtab-btn active" id="gt1" onclick="irGrafico(1)">CATEGORÍAS</button>
      <button class="gtab-btn" id="gt2" onclick="irGrafico(2)">MENSUAL</button>
      <button class="gtab-btn" id="gt3" onclick="irGrafico(3)">AÑO vs AÑO</button>
      <button class="gtab-btn" id="gt4" onclick="irGrafico(4)">🥧 TARTA</button>
    </div>

    <!-- TOGGLE CASA (oculto por defecto) -->
    <div id="casaToggleBar">
      <span style="font-size:12px;opacity:.6">Excluir operaciones casa</span>
      <button id="btnCasaG" onclick="toggleCasa();actualizarBtnCasa()"
        style="background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.25);border-radius:20px;padding:5px 14px;color:var(--primary);font-size:12px;font-weight:700;cursor:pointer;min-width:44px">
        OFF
      </button>
    </div>

    <!-- FILTROS (visibles solo en lista) -->
    <div id="filtrosBar" class="filtros-wrapper visible">
      <div class="filtro-item">
        <span style="font-size:9px;color:var(--primary)">AÑO</span>
        <select id="filtroAño" onchange="resetPagina();mostrar()"></select>
      </div>
      <div class="filtro-item">
        <span style="font-size:9px;color:var(--primary)">MES</span>
        <select id="filtroMes" onchange="resetPagina();mostrar()"></select>
      </div>
      <div class="filtro-item">
        <span style="font-size:9px;color:var(--primary)">ORI</span>
        <select id="filtroOri" onchange="resetPagina();mostrar()"></select>
      </div>
      <div class="filtro-item">
        <span style="font-size:9px;color:var(--primary)">CAT</span>
        <select id="filtroCat" onchange="resetPagina();mostrar()"></select>
      </div>
      <div class="filtro-item">
        <span style="font-size:9px;color:var(--primary)">SUBCAT</span>
        <select id="filtroSub" onchange="resetPagina();mostrar()"></select>
      </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL — el main.js siempre escribe aquí -->
    <div class="container">
      <div id="lista" aria-live="polite"></div>
      <div id="loader" style="display:none"><div class="spinner"></div></div>
      <div style="height:250px"></div>
    </div>

    <!-- TARTA: contenedor separado, no toca #lista -->
    <div id="tartaContainer">
      <div id="tartaContent"></div>
    </div>

    <!-- FOOTER CONTROLES — idéntico al original -->
    <div class="footer-controles">
      <div class="footer-row">
        <button class="plus" id="footerBtnLeft"
                style="width:55px;height:55px;background:var(--gold-metal);font-size:20px">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="black" stroke-width="3">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6"  y1="20" x2="6"  y2="14"></line>
          </svg>
        </button>
        <button class="plus" id="footerBtnCenter" aria-label="Nuevo registro">+</button>
        <div id="balance">0.00 €</div>
        <button class="plus" aria-hidden="true"
                style="opacity:0;pointer-events:none;position:absolute;left:-9999px;"></button>
      </div>
    </div>

  </div><!-- /movimientos -->

  <!-- FORMULARIO — idéntico al original -->
  <div id="form" class="hidden">
    <div class="topbar" id="tituloForm">NUEVO REGISTRO</div>
    <div class="container">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <select id="origen"></select>
        <input type="date" id="fecha" style="width:45%" onclick="this.showPicker()" />
      </div>
      <input type="hidden" id="editId" />
      <div style="display:flex;gap:8px;align-items:center">
        <select id="categoria" onchange="manejarNuevo(this,'categoria')"></select>
        <button onclick="borrarElemento('categoria')"
                style="width:70px;height:68px;border-radius:16px;background:var(--danger);border:none;color:#fff;font-size:24px">🗑️</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
        <select id="subcategoria" onchange="manejarNuevo(this,'subcategoria')"></select>
        <button onclick="borrarElemento('subcategoria')"
                style="width:70px;height:68px;border-radius:16px;background:var(--danger);border:none;color:#fff;font-size:24px">🗑️</button>
      </div>
      <input id="importe" type="number" step="0.01" inputmode="decimal" placeholder="0.00 €"
             style="height:70px!important;font-weight:700" />
      <textarea id="descripcion" maxlength="200" placeholder="Nota..." style="min-height:100px"></textarea>
      <button onclick="guardar()"
              style="background:var(--gold-gradient);color:#000;height:70px;width:100%;font-size:22px;margin-top:10px;border:none;font-weight:700;border-radius:16px">GUARDAR</button>
      <div id="btnEliminarRegistro" class="hidden">
        <button onclick="eliminarRegistroActual()"
                style="background:var(--danger);color:#fff;height:60px;width:100%;font-size:18px;margin-top:10px;border:none;font-weight:700;border-radius:16px">ELIMINAR</button>
      </div>
      <button onclick="volver()" class="btn-cancel-plate">CANCELAR</button>
    </div>
  </div>

  <!-- IMPORT/EXPORT — idéntico al original -->
  <div id="importExport" class="hidden"
       style="position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:2000;">
    <div class="topbar">IMPORT / EXPORT</div>
    <div class="container" style="padding-top:25px;padding-bottom:110px;">
      <div class="ie-actions">
        <button class="btn-gold btn-unified" onclick="exportarCSV()">📊 Exportar CSV</button>
        <button class="btn-silver btn-unified" onclick="document.getElementById('inputFile2').click()">📥 Importar CSV</button>
        <input id="inputFile2" class="hidden" type="file" onchange="importarCSV(event)" />
        <button class="btn-gold btn-unified" onclick="dropboxUploadEncryptedBackup()">📤 Guardar copia en Dropbox</button>
        <button class="btn-silver btn-unified" onclick="dropboxDownloadAndRestore()">📥 Restaurar copia desde Dropbox</button>
        <button class="btn-unified btn-danger ie-span2" onclick="resetTotal()">⚠️ Reset</button>
      </div>
    </div>
    <div id="ieFooter">
      <button id="ieVolver" class="btn-silver btn-unified">⬅ VOLVER</button>
    </div>
  </div>

  <!-- JS -->
  <script src="./js/utils.js?v=2"></script>
  <script src="./js/main.js?v=23"></script>

  <script>
  // ============================================================
  // LÓGICA DE PESTAÑAS — enfoque simple: una sola #lista
  // El main.js siempre escribe en #lista.
  // Nosotros solo mostramos/ocultamos la UI alrededor.
  // ============================================================
  let _tab  = 'lista';
  let _gTab = 1;

  function irTab(tab) {
    _tab = tab;

    // Actualizar botones de la barra
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('tbn-' + tab);
    if (btn) btn.classList.add('active');

    // Mostrar/ocultar elementos según pestaña
    const filtros    = document.getElementById('filtrosBar');
    const gtabs      = document.getElementById('gtab-bar');
    const casaBar    = document.getElementById('casaToggleBar');
    const tarta      = document.getElementById('tartaContainer');
    const listaWrap  = document.querySelector('#movimientos .container');
    const footer     = document.querySelector('.footer-controles');

    if (tab === 'lista') {
      filtros.classList.add('visible');
      gtabs.classList.remove('visible');
      casaBar.classList.remove('visible');
      tarta.classList.remove('visible');
      if (listaWrap) listaWrap.style.display = '';
      if (footer)    footer.style.display    = '';
      // Decirle al main que vuelva a modo lista
      const m = document.getElementById('movimientos');
      if (m) m.dataset.modo = 'lista';
      if (window.mostrar) mostrar();

    } else if (tab === 'graficos') {
      filtros.classList.remove('visible');
      gtabs.classList.add('visible');
      casaBar.classList.add('visible');
      if (footer) footer.style.display = 'none';
      // Renderizar el gráfico activo
      irGrafico(_gTab);
    }

    window.scrollTo(0, 0);
  }

  function irGrafico(n) {
    _gTab = n;

    // Actualizar sub-tabs
    document.querySelectorAll('.gtab-btn').forEach((b, i) => b.classList.toggle('active', i + 1 === n));

    const tarta     = document.getElementById('tartaContainer');
    const listaWrap = document.querySelector('#movimientos .container');

    if (n === 4) {
      // Tarta: ocultar #lista, mostrar tarta
      if (listaWrap) listaWrap.style.display = 'none';
      tarta.classList.add('visible');
      _dibujarTarta();
      return;
    }

    // Otros gráficos: mostrar #lista, ocultar tarta
    tarta.classList.remove('visible');
    if (listaWrap) listaWrap.style.display = '';

    if (!window.mostrar) return;
    const m = document.getElementById('movimientos');
    if (!m) return;

    if (n === 1) m.dataset.modo = 'graficos';
    else if (n === 2) m.dataset.modo = 'graficos2';
    else if (n === 3) { if (window.renderComparativaAnual) { renderComparativaAnual(); return; } }

    mostrar();
  }

  function actualizarBtnCasa() {
    const btn = document.getElementById('btnCasaG');
    if (btn) btn.textContent = (typeof hideCasa !== 'undefined' && hideCasa) ? 'ON' : 'OFF';
    if (_tab === 'graficos' && _gTab !== 4) irGrafico(_gTab);
    else if (_tab === 'graficos' && _gTab === 4) _dibujarTarta();
  }

  // ── GRÁFICO DE TARTA ──
  function _dibujarTarta() {
    const dst = document.getElementById('tartaContent');
    if (!dst) return;
    dst.innerHTML = '<div style="text-align:center;padding:20px;opacity:.5">Calculando...</div>';

    const ahora    = new Date();
    const desde    = new Date(ahora.getFullYear(), ahora.getMonth() - 11, 1);
    const desdeISO = desde.toISOString().split('T')[0];
    const movs     = window.movimientos;

    if (!movs || !movs.length) {
      dst.innerHTML = '<p style="text-align:center;opacity:.5;padding:30px">Sin datos</p>'; return;
    }
    const base = movs.filter(m => {
      if (m.imp >= 0) return false;
      if (m.f < desdeISO) return false;
      if (typeof hideCasa !== 'undefined' && hideCasa && window.isCasaCategory && isCasaCategory(m.c)) return false;
      return true;
    });
    if (!base.length) {
      dst.innerHTML = '<p style="text-align:center;opacity:.5;padding:30px">Sin gastos en los últimos 12 meses</p>'; return;
    }

    const totales = {};
    for (const m of base) totales[m.s] = (totales[m.s] || 0) + Math.abs(m.imp);
    const total  = Object.values(totales).reduce((a, b) => a + b, 0);
    const items  = Object.entries(totales).sort((a, b) => b[1] - a[1]);
    const top    = items.slice(0, 12);
    const restoV = items.slice(12).reduce((s, [, v]) => s + v, 0);
    if (restoV > 0) top.push(['Otros', restoV]);

    const pal = ['#d4af37','#ef4444','#22c55e','#3b82f6','#f59e0b','#8b5cf6',
                 '#ec4899','#14b8a6','#f97316','#06b6d4','#84cc16','#a855f7','#6b7280'];
    const SZ=280, CX=140, CY=140, R=110, RI=58;
    let angle = -Math.PI/2, paths = '';

    top.forEach(([label, val], i) => {
      const sweep = (val/total)*2*Math.PI;
      const cos0=Math.cos(angle), sin0=Math.sin(angle);
      const cos1=Math.cos(angle+sweep), sin1=Math.sin(angle+sweep);
      const x1=CX+R*cos0, y1=CY+R*sin0, x2=CX+R*cos1, y2=CY+R*sin1;
      const ix1=CX+RI*cos0, iy1=CY+RI*sin0, ix2=CX+RI*cos1, iy2=CY+RI*sin1;
      const lg = sweep > Math.PI ? 1 : 0;
      const col = pal[i%pal.length];
      paths += '<path d="M'+ix1+' '+iy1+' L'+x1+' '+y1+' A'+R+' '+R+' 0 '+lg+' 1 '+x2+' '+y2+' L'+ix2+' '+iy2+' A'+RI+' '+RI+' 0 '+lg+' 0 '+ix1+' '+iy1+' Z"'
             + ' fill="'+col+'" stroke="rgba(0,0,0,.4)" stroke-width="1.5"'
             + ' style="cursor:pointer;transition:opacity .2s"'
             + ' onclick="this.style.opacity=this.style.opacity===\'0.4\'?\'1\':\'0.4\'"/>';
      angle += sweep;
    });

    const centro = '<text x="'+CX+'" y="'+(CY-8)+'" text-anchor="middle" fill="#d4af37" font-size="14" font-weight="bold">'+items.length+' subcats</text>'
                 + '<text x="'+CX+'" y="'+(CY+11)+'" text-anchor="middle" fill="rgba(255,255,255,.6)" font-size="11">'+Math.round(total).toLocaleString('es')+' €</text>';

    const mC = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const mesD = mC[desde.getMonth()]+' '+desde.getFullYear();
    const mesH = mC[ahora.getMonth()]+' '+ahora.getFullYear();

    const leyenda = top.map(([label, val], i) => {
      const pct = ((val/total)*100).toFixed(1);
      const col = pal[i%pal.length];
      return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">'
           + '<div style="width:12px;height:12px;border-radius:3px;background:'+col+';flex-shrink:0"></div>'
           + '<div style="flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+label+'</div>'
           + '<div style="font-size:12px;font-weight:700;color:'+col+';white-space:nowrap;margin-right:4px">'+pct+'%</div>'
           + '<div style="font-size:11px;opacity:.5;white-space:nowrap">'+Math.round(val).toLocaleString('es')+'€</div>'
           + '</div>';
    }).join('');

    dst.innerHTML = '<div style="padding:16px 14px 4px;text-align:center">'
      + '<div style="font-size:10px;font-weight:700;color:#d4af37;letter-spacing:1.5px;margin-bottom:3px">DISTRIBUCIÓN POR SUBCATEGORÍA</div>'
      + '<div style="font-size:11px;opacity:.45;margin-bottom:14px">'+mesD+' → '+mesH+'</div>'
      + '<svg viewBox="0 0 '+SZ+' '+SZ+'" width="100%" style="max-width:310px;display:block;margin:0 auto">'+paths+centro+'</svg>'
      + '<div style="font-size:10px;opacity:.35;margin:6px 0 16px">Toca un sector para resaltarlo</div>'
      + '</div><div style="padding:0 14px 30px">'+leyenda+'</div>';
  }

  // ── PARCHES al main.js ──
  window.addEventListener('load', () => {

    // Cuando el main.js llama a setModo() por los botones del footer,
    // sincronizamos la barra de pestañas
    const _origSetModo = window.setModo;
    if (_origSetModo) {
      window.setModo = function(modo) {
        _origSetModo(modo);
        if (modo === 'graficos') {
          _tab = 'graficos'; _gTab = 1;
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.getElementById('tbn-graficos')?.classList.add('active');
          document.querySelectorAll('.gtab-btn').forEach((b,i) => b.classList.toggle('active', i===0));
          document.getElementById('gtab-bar')?.classList.add('visible');
          document.getElementById('casaToggleBar')?.classList.add('visible');
          document.getElementById('filtrosBar')?.classList.remove('visible');
          document.querySelector('.footer-controles').style.display = 'none';
        } else if (modo === 'graficos2') {
          _tab = 'graficos'; _gTab = 2;
          document.querySelectorAll('.gtab-btn').forEach((b,i) => b.classList.toggle('active', i===1));
        } else if (modo === 'lista') {
          _tab = 'lista';
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.getElementById('tbn-lista')?.classList.add('active');
          document.getElementById('gtab-bar')?.classList.remove('visible');
          document.getElementById('casaToggleBar')?.classList.remove('visible');
          document.getElementById('filtrosBar')?.classList.add('visible');
          document.getElementById('tartaContainer')?.classList.remove('visible');
          document.querySelector('#movimientos .container').style.display = '';
          document.querySelector('.footer-controles').style.display = '';
        }
      };
    }

    // volver() regresa a lista
    const _origVolver = window.volver;
    if (_origVolver) {
      window.volver = function() {
        _origVolver();
        irTab('lista');
      };
    }
  });
  </script>

</body>
</html>
